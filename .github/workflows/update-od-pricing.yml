name: Update On-Demand Pricing

on:
  schedule:
    # 毎週月曜 17:00 JST (08:00 UTC)。update-regions.yml の 1 時間前
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-od-pricing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # us-east-1 と ap-northeast-1 の index.json (各 300〜480MB) を順に読む
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update On-Demand pricing from the AWS Price List
        run: node scripts/update-od-pricing.mjs

      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取得に成功すれば pricingAsOf (最終確認日) が変わるので、通常は毎回差分が出る
          if git diff --quiet; then
            echo "No pricing changes."
            exit 0
          fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instances.json
          git commit -m "chore: On-Demand 価格を自動更新"
          # 他のデータ更新ワークフローが先に push していても non-fast-forward で落ちないようにする
          git pull --rebase origin main
          git push
          # GITHUB_TOKEN の push では deploy.yml が発火しないため明示的に起動する
          gh workflow run deploy.yml --ref main
