name: Update CB Pricing

on:
  schedule:
    # 毎日 18:17 JST (09:17 UTC)。pricing.json 側の更新後に実行される想定。
    # 毎時 0 分は GitHub Actions が混み、schedule が大きく遅れるので外している
    - cron: "17 9 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [cb-pricing-updated]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-cb-pricing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Update CB pricing from pricing.json
        run: node scripts/update-cb-pricing.mjs

      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取得に成功すれば cbAsOf (最終確認日) が変わるので、その日の初回は毎回差分が出る
          if git diff --quiet; then
            echo "No pricing changes."
            exit 0
          fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instances.json
          git commit -m "chore: CB価格を自動更新"
          # 他のデータ更新ワークフローが先に push していても non-fast-forward で落ちないようにする
          git pull --rebase origin main
          git push
          # GITHUB_TOKEN の push では deploy.yml が発火しないため明示的に起動する
          gh workflow run deploy.yml --ref main
