name: Update Region Availability

on:
  schedule:
    # 毎週月曜 18:00 JST (09:00 UTC)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-regions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 34 リージョン x index.json 全体 (約 300〜480MB) を並列 3 で読む。
    # 提供状況 (products) だけでなく On-Demand 価格 (terms) も採るため、
    # products で打ち切っていた頃の 2〜3 倍を落とす。見込みは転送量 10〜15GB / 20〜40 分。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update region availability and pricing from the AWS Price List
        run: node scripts/update-regions.mjs

      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No region data changes."
            exit 0
          fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regions.json
          git commit -m "chore: リージョン提供状況と価格を自動更新"
          # 他のデータ更新ワークフローが先に push していても non-fast-forward で落ちないようにする
          git pull --rebase origin main
          git push
          # GITHUB_TOKEN の push では deploy.yml が発火しないため明示的に起動する
          gh workflow run deploy.yml --ref main
